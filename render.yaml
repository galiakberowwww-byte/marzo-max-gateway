services:
  - type: web
    # Keep the legacy Render service name so the existing MAX webhook URL stays stable.
    name: marzo-max-gateway
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: MAX_BOT_TOKEN
        sync: false
      - key: MAX_WEBHOOK_SECRET
        sync: false
      - key: RODCOM_WEBHOOK_URL
        sync: false
      - key: RODCOM_WEBHOOK_SECRET
        sync: false
      - key: RODCOM_BRIDGE_SECRET
        sync: false
      - key: PUBLIC_WEBHOOK_URL
        value: https://marzo-max-gateway.onrender.com/webhooks/max
      - key: MAX_CA_BUNDLE
        value: /app/certs/max-russian-trusted-ca.pem
