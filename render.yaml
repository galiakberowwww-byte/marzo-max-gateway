services:
  - type: web
    # Must be a new Render service. Never point this Blueprint at RODCOM.
    name: marzo-max-gateway-v2
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: MAX_BOT_TOKEN
        sync: false
      - key: MAX_WEBHOOK_SECRET
        sync: false
      - key: MAX_CA_BUNDLE
        value: /app/certs/max-russian-trusted-ca.pem
      - key: MARZO_DATABASE_PATH
        value: /app/data/marzo.sqlite3
      - key: MARZO_ADMIN_TOKEN
        sync: false
      - key: INTERIOR_PROJECT_API_URL
        sync: false
      - key: INTERIOR_PROJECT_API_TOKEN
        sync: false
